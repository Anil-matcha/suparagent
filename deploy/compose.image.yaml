# Use with compose.yaml; requires Docker Compose 2.24.4 or newer for !reset.
# SUPARAGENT_IMAGE must name a published version or digest (see SELF-HOSTING.md).
# Existing data, settings, network and proxy overlays are preserved.
services:
  suparagent:
    build: !reset null
    image: ${SUPARAGENT_IMAGE:?set SUPARAGENT_IMAGE to a published version or digest}
    pull_policy: always
