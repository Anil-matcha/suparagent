# nginx in front of Suparagent, as a container on the app's network. Use it with the base file:
#
#   docker compose -f compose.yaml -f deploy/proxy/compose.nginx.yaml up -d --build
#
# Set SUPARAGENT_DOMAIN (the name people type) and put the certificate at
# $SUPARAGENT_TLS_DIR/fullchain.pem and the key at $SUPARAGENT_TLS_DIR/privkey.pem (default ./tls).
#
# The proxy gets a fixed address and the app trusts exactly that address, so only this container's
# X-Forwarded-For and X-Forwarded-Proto are believed; see compose.yaml for why a whole network is
# never named. Do not attach other containers to this network.
services:
  suparagent:
    environment:
      TRUSTED_PROXIES: ${SUPARAGENT_TRUSTED_PROXIES:-${SUPARAGENT_PROXY_IP:-172.31.250.10}}

  proxy:
    image: ${SUPARAGENT_NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      suparagent:
        condition: service_healthy
    environment:
      SUPARAGENT_DOMAIN: ${SUPARAGENT_DOMAIN:?set SUPARAGENT_DOMAIN to the name people use, for example dots.example.com}
    ports:
      - "${SUPARAGENT_HTTP_BIND:-0.0.0.0}:${SUPARAGENT_HTTP_PORT:-80}:80"
      - "${SUPARAGENT_HTTP_BIND:-0.0.0.0}:${SUPARAGENT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${SUPARAGENT_TLS_DIR:-./tls}:/etc/nginx/tls:ro
    networks:
      default:
        ipv4_address: ${SUPARAGENT_PROXY_IP:-172.31.250.10}
        aliases:
          - ${SUPARAGENT_DOMAIN}
